name: afl_project_db

profile: afl_project_db

model-paths: ["models"]

clean-targets:
  - "target"
  - "dbt_packages"


models:
  afl_project_db:
      # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: "{{ 'table' if target.name == 'prod' else 'view' }}"
