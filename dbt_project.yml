name: afl_project_db

profile: afl_project_db

model-paths: ["models"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  afl_project_db:
    +schema: raw

models:
  afl_project_db:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
